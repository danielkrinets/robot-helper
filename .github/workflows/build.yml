name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pyautogui pynput pillow keyring pyperclip pytest pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm --windowed --name RobotHelper --osx-bundle-identifier app.robothelper.RobotHelper --paths . --collect-all robot_helper --collect-all pynput --collect-submodules keyring.backends --icon robot_helper/assets/${{ runner.os == 'Windows' && 'icon.ico' || 'icon.icns' }} packaging/launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: RobotHelper-${{ matrix.os }}
          path: dist/
